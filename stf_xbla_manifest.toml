# Game hooks, implemented in src/main.cpp. They are anchored to guest addresses
# so they survive changes to how the generated sources are laid out.

# Help & Options scene, after its row labels are initialized: swap in the
# Recompilation Settings, Remap Inputs and Achievements pages, and resize the
# panel when the row count changes.
[[entrypoint.midasm_hook]]
name = "StfrPrepareHelpOptionsHook"
address = 0x8211667C
registers = ["r29", "r1", "r13"]

# Help & Options scene setup opens its panel for 5 rows (bl 0x82126948 with
# type 14). The port lists 7, so open the matching taller panel.
[[entrypoint.midasm_hook]]
name = "StfrHelpOptionsPanelTypeHook"
address = 0x82114B54
registers = ["r4"]

# Help & Options title string id (li r3,418).
[[entrypoint.midasm_hook]]
name = "StfrHelpOptionsTitleHook"
address = 0x821166FC
registers = ["r3"]
after_instruction = true

# Original Settings scene: follow the Screen Size setting.
[[entrypoint.midasm_hook]]
name = "StfrPrepareNativeSettingsHook"
address = 0x82117480
registers = ["r27"]

# Main menu scene update: remember the object to route the Achievements entry.
[[entrypoint.midasm_hook]]
name = "StfrCaptureMainMenuHook"
address = 0x82148134
registers = ["r29"]

# String table lookup: serve the port's own strings.
[[entrypoint.midasm_hook]]
name = "StfrResolveStringHook"
address = 0x821817E0
registers = ["r3"]
return_on_true = true

# Pause menu "Achievements" normally opens the Xbox Guide (bl 0x821A8538).
# Show the port's achievement list in the pause menu instead.
[[entrypoint.midasm_hook]]
name = "StfrOpenPauseAchievementsHook"
address = 0x8218C674
registers = ["r3"]
jump_address = 0x8218C67C
